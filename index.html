<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121d2e">
<title>Classical Mechanics · Revision</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f1;--surface:#fffefa;--ink:#222b35;--muted:#69717a;--line:#dadfdf;
  --soft:#f1f3f1;--accent:#667f71;--accent-contrast:#fff;--warm:#b78161;
  --shadow:0 14px 38px rgba(27,48,46,.055);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1420;--surface:#152132;--ink:#f6f0e9;--muted:#b6becb;--line:#35445a;
  --soft:#1d2b3e;--accent:#accdb8;--accent-contrast:#13261d;--warm:#e4b388;
  --shadow:0 18px 44px rgba(0,0,0,.17);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);line-height:1.45}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default;opacity:.65}
.shell{width:min(1140px,calc(100% - 36px));margin:0 auto;padding:32px 0 62px}
.head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px;font-size:.9rem;font-weight:760;letter-spacing:.015em}
.mark{display:grid;place-items:center;width:39px;height:39px;border:1px solid var(--line);border-radius:12px;font-size:1.2rem;color:var(--accent)}
.theme-button{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:9px 13px;border-radius:10px;font-size:.8rem;font-weight:650}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);padding:28px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}
.overline{font-size:.71rem;color:var(--muted);font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.live{font-size:.74rem;color:var(--muted)}
.activity{padding:46px 0 44px}
h1{font-size:clamp(2.9rem,6vw,5rem);font-weight:780;letter-spacing:-.058em;line-height:1.02;margin:12px 0 27px}
.countdown{display:flex;align-items:baseline;gap:15px;flex-wrap:wrap}
.count-number{font-size:clamp(4.1rem,9vw,6.8rem);font-weight:750;letter-spacing:-.07em;line-height:.9;font-variant-numeric:tabular-nums}
.count-label{font-size:1.02rem;color:var(--muted);max-width:245px;line-height:1.45}
.countdown.no-count .count-number{display:none}
.countdown.no-count .count-label{font-size:1.1rem;max-width:none}
.rule{height:1px;background:var(--line);margin:0 0 27px}
h2{font-size:1.14rem;line-height:1.25;font-weight:750;letter-spacing:-.018em;margin:0}
.schedule{list-style:none;margin:17px 0 0;padding:0;display:grid;gap:9px}
.schedule li{display:grid;grid-template-columns:112px 1fr auto;align-items:center;column-gap:13px;padding:15px 15px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.schedule li.is-now{background:var(--soft);border-color:var(--accent)}
.schedule li.is-past{opacity:.65}
.schedule time{font-size:.81rem;color:var(--muted);font-weight:680;font-variant-numeric:tabular-nums}
.schedule strong{font-size:.92rem;font-weight:690}
.schedule small{color:var(--muted);font-size:.74rem}
.schedule .is-now small{color:var(--accent);font-weight:750}
.todo-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.todo-count{font-size:.77rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.add-form{display:flex;gap:8px;margin-top:23px}
.add-form input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;font-size:.88rem}
.add-form input::placeholder{color:var(--muted)}
.add-form button{background:var(--accent);color:var(--accent-contrast);border:0;border-radius:10px;padding:0 17px;font-size:.86rem;font-weight:750}
.todo-list{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:6px}
.todo-list li{display:flex;align-items:center;gap:10px;padding:11px 3px;border-bottom:1px solid var(--line)}
.todo-list li:last-child{border-bottom:0}
.todo-check{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.todo-text{flex:1;min-width:0;background:transparent;border:1px solid transparent;color:var(--ink);padding:6px 4px;border-radius:6px;font-size:.88rem}
.todo-text:hover,.todo-text:focus{border-color:var(--line)}
.todo-list li.done .todo-text{text-decoration:line-through;color:var(--muted)}
.remove-task{flex:none;background:transparent;border:0;color:var(--muted);padding:5px 9px;border-radius:8px;font-size:1.17rem;line-height:1}
.remove-task:hover{background:var(--soft);color:var(--ink)}
.empty{margin:23px 0 0;color:var(--muted);font-size:.84rem}
.sr-only{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
@media(max-width:800px){.layout{grid-template-columns:1fr}.shell{width:min(660px,calc(100% - 26px));padding-top:21px}.panel{padding:22px}.activity{padding:33px 0 38px}}
@media(max-width:420px){.brand{font-size:.79rem}.head{gap:7px}.theme-button{font-size:.72rem;padding:8px}.schedule li{grid-template-columns:97px 1fr auto;padding:13px 10px;gap:7px}.schedule time{font-size:.73rem}.schedule strong{font-size:.84rem}.count-label{font-size:.9rem}}
</style>
</head>
<body>
<div class="shell">
<header class="head">
 <div class="brand"><span class="mark" id="themeIcon" aria-hidden="true">❄</span><span>Classical Mechanics</span></div>
 <button class="theme-button" type="button" id="themeToggle">Dark mode</button>
</header>
<main class="layout">
 <section class="panel" aria-labelledby="activityTitle">
  <div class="section-heading"><span class="overline">Today</span><span class="live" id="currentTime"></span></div>
  <div class="activity">
   <span class="overline">Current activity</span>
   <h1 id="activityTitle">Revise</h1>
   <div class="countdown" id="countdown" role="timer" aria-live="off">
    <strong class="count-number" id="minutesLeft">—</strong>
    <span class="count-label" id="countdownLabel">minutes until run break</span>
   </div>
  </div>
  <div class="rule"></div>
  <h2>Schedule</h2>
  <ul class="schedule" id="schedule">
   <li data-slot="run"><time datetime="14:30">14:30–15:00</time><strong>Run</strong><small>Break</small></li>
   <li data-slot="dinner"><time datetime="18:30">18:30–19:00</time><strong>Dinner</strong><small>Break</small></li>
   <li data-slot="problems"><time datetime="19:00">19:00–21:00</time><strong>Exam problems</strong><small>Focus</small></li>
  </ul>
 </section>
 <aside class="panel" aria-labelledby="todoHeading">
  <div class="todo-head"><h2 id="todoHeading">To-do</h2><span class="todo-count" id="taskCount">0 / 0 done</span></div>
  <form class="add-form" id="todoForm">
   <label for="taskInput" class="sr-only">Add a task</label>
   <input id="taskInput" type="text" maxlength="120" placeholder="Add a task" autocomplete="off" required>
   <button type="submit">Add</button>
  </form>
  <ul class="todo-list" id="todoList"></ul>
  <p class="empty" id="emptyMessage">No tasks added yet.</p>
 </aside>
</main>
</div>
<script>
(() => {
'use strict';
const LIST_KEY = 'revision-simple-checklist-v1';
const THEME_KEY = 'cm-dashboard-theme';
const $ = id => document.getElementById(id);
const STARTS = { run:14*60+30, endRun:15*60, dinner:18*60+30, endDinner:19*60, endProblems:21*60 };
function getTimeState(now) {
 const current=now.getHours()*60+now.getMinutes()+now.getSeconds()/60+now.getMilliseconds()/60000;
 const minutesTo = target => Math.max(0,Math.ceil(target-current));
 if(current<STARTS.run) return {title:'Revise',remaining:minutesTo(STARTS.run),label:'minutes until run break',now:null};
 if(current<STARTS.endRun) return {title:'Break',remaining:minutesTo(STARTS.endRun),label:'minutes left in run break',now:'run'};
 if(current<STARTS.dinner) return {title:'Revise',remaining:minutesTo(STARTS.dinner),label:'minutes until dinner break',now:null};
 if(current<STARTS.endDinner) return {title:'Break',remaining:minutesTo(STARTS.endDinner),label:'minutes left in dinner break',now:'dinner'};
 if(current<STARTS.endProblems) return {title:'Exam problems',remaining:minutesTo(STARTS.endProblems),label:'minutes left for exam problems',now:'problems'};
 return {title:'Done',remaining:null,label:'Schedule finished for today',now:null};
}
function updateSchedule(){
 const now=new Date();
 const status=getTimeState(now);
 $('activityTitle').textContent=status.title;
 $('minutesLeft').textContent=status.remaining===null?'':String(status.remaining);
 $('countdownLabel').textContent=status.label;
 $('countdown').classList.toggle('no-count',status.remaining===null);
 $('currentTime').textContent=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
 const elapsed=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
 for(const [key,start,end] of [['run',STARTS.run,STARTS.endRun],['dinner',STARTS.dinner,STARTS.endDinner],['problems',STARTS.endDinner,STARTS.endProblems]]){
  const node=document.querySelector('[data-slot="'+key+'"]');
  if(!node)continue;
  node.classList.toggle('is-now',status.now===key);
  node.classList.toggle('is-past',elapsed>=end);
  const tag=node.querySelector('small');
  if(tag)tag.textContent=status.now===key?'Now':key==='problems'?'Focus':'Break';
 }
}
function readTasks(){
 try{
  const value=JSON.parse(localStorage.getItem(LIST_KEY)||'[]');
  if(!Array.isArray(value))return [];
  return value.filter(x=>x && typeof x.text==='string' && x.text.trim()).map(x=>({
   id:String(x.id||String(Date.now())+Math.random().toString(36).slice(2)),
   text:x.text.slice(0,120),done:!!x.done
  })).slice(0,200);
 }catch(e){return []}
}
let tasks=readTasks();
function saveTasks(){
 try{localStorage.setItem(LIST_KEY,JSON.stringify(tasks))}catch(e){}
}
function renderTasks(){
 const list=$('todoList');
 list.replaceChildren();
 for(const task of tasks){
  const item=document.createElement('li');
  item.dataset.id=task.id;
  if(task.done)item.classList.add('done');
  const checkbox=document.createElement('input');
  checkbox.type='checkbox';checkbox.className='todo-check';checkbox.checked=task.done;
  checkbox.setAttribute('aria-label','Mark '+task.text+' complete');
  const text=document.createElement('input');
  text.type='text';text.className='todo-text';text.value=task.text;text.maxLength=120;
  text.setAttribute('aria-label','Edit to-do task');
  const remove=document.createElement('button');
  remove.type='button';remove.className='remove-task';remove.textContent='×';
  remove.setAttribute('aria-label','Remove '+task.text);
  checkbox.addEventListener('change',()=>{
   task.done=checkbox.checked;item.classList.toggle('done',task.done);saveTasks();updateCount();
  });
  text.addEventListener('input',()=>{task.text=text.value.slice(0,120);saveTasks()});
  text.addEventListener('blur',()=>{if(!task.text.trim()){tasks=tasks.filter(t=>t.id!==task.id);renderTasks();saveTasks()}});
  remove.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);saveTasks();renderTasks()});
  item.append(checkbox,text,remove);
  list.append(item);
 }
 $('emptyMessage').hidden=tasks.length!==0;
 updateCount();
}
function updateCount(){
 const done=tasks.filter(t=>t.done).length;
 $('taskCount').textContent=done+' / '+tasks.length+' done';
}
$('todoForm').addEventListener('submit',event=>{
 event.preventDefault();
 const input=$('taskInput'),name=input.value.trim();
 if(!name)return;
 tasks.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),text:name.slice(0,120),done:false});
 input.value='';saveTasks();renderTasks();input.focus();
});
function setTheme(theme){
 const mode=theme==='dark'?'dark':'light';
 document.documentElement.dataset.theme=mode;
 $('themeIcon').textContent=mode==='dark'?'✦':'❄';
 $('themeToggle').textContent=mode==='dark'?'Light mode':'Dark mode';
 try{localStorage.setItem(THEME_KEY,mode)}catch(e){}
}
try{setTheme(localStorage.getItem(THEME_KEY)||'light')}catch(e){setTheme('light')}
$('themeToggle').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
renderTasks();
updateSchedule();
setInterval(updateSchedule,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateSchedule()});
})();
</script>
</body>
</html>
